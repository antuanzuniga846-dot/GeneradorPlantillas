<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Fondo redondeado sólido navy — visible a cualquier tamaño -->
  <rect x="0" y="0" width="32" height="32" rx="7" ry="7" fill="#1e3a5f"/>

  <!-- Headset simplificado, grueso y legible a 16px -->
  <!-- Arco superior -->
  <path d="M7 16 Q7 8 16 8 Q25 8 25 16"
        stroke="#dceeff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Almohadilla izquierda -->
  <rect x="4" y="15" width="5" height="8" rx="2" ry="2" fill="#dceeff"/>
  <!-- Almohadilla derecha -->
  <rect x="23" y="15" width="5" height="8" rx="2" ry="2" fill="#dceeff"/>
  <!-- Brazo micrófono -->
  <path d="M25 21 Q25 26 21 27" stroke="#dceeff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Punta micrófono -->
  <circle cx="19.5" cy="27.5" r="2" fill="#dceeff"/>
</svg>
